  #           oneOf:
  #             - $ref: "#/components/schemas/entity-person"
  #             - $ref: "#/components/schemas/entity-place"
  #             - $ref: "#/components/schemas/entity-org"
  #             - $ref: "#/components/schemas/entity-bibl"
  #             - $ref: "#/components/schemas/entity-event"
  #   file:
  #     description: A full TEI file
  #     required: true
  #     content:
  #       application/xml:
  #         schema:
  #           $ref: "#/components/schemas/TEI"

  schemas:
    contents:
      type: object
      xml:
        name: contents
        namespace: "https://github.com/dariok/wdbplus/api/schema/v1"
      allOf:
        - $ref: "#/components/schemas/listFiles"
        - $ref: "#/components/schemas/listProjects"
      required:
        - for
    login:
      type: object
      required: [ "user" ]
      properties:
        user:
          description: "Name of the user"
          type: string
        password:
          type: string
          format: password
    TEI:
      description: A full TEI file
      type: object
      xml:
        namespace: "http://www.tei-c.org/ns/1.0"
        name: "TEI"

    # listAnnotations:
