components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      name: wdbplus.login
      in: cookie

  parameters:
    accept:
      name: accept
      in: header
      description: Which content type should be created for this view
      schema:
        type: string
      required: true
    ed:
      name: "ed"
      in: path
      description: The ID of a project
      schema:
        type: string
      required: true
  #   entity:
  #     name: "entity"
  #     in: path
  #     description: The ID of an entity
  #     schema:
  #       type: string
  #     required: true
    id:
      name: "id"
      in: path
      description: The ID of a resource
      schema:
        type: string
      required: true
    parent:
      name: "parent"
      in: path
      description: The ID of a parent project
      schema:
        type: string
      required: true
    q:
      name: q
      in: query
      required: true
      schema:
        type: string
      description: general query or filter parameter
  #   type:
  #     name: type
  #     in: query
  #     description: The type of entity
  #     schema:
  #       enum:
  #         - per
  #         - pla
  #         - org
  #         - bib
  #         - evt
  #     required: true
    start:
      name: start
      in: query
      description: from which position in a list to start (1-based)
      schema:
        type: integer
        default: 1
        minimum: 1
    max:
      name: max
      in: query
      description: the maximum number of elements to return in a list
      schema:
        type: integer
        minimum: 1
        default: 25
        maximum: 100
    modified:
      name: "If-Modified-Since"
      in: header
      schema:
        type: string
        format: date-time
    view:
      name: view
      in: path
      description: Which view is to be applied to a resource
      schema:
        type: string
      required: true
  
  responses:
    authenticate:
      description: Authentication necessary
      headers:
        WWW-Authenticate:
          description: Challenge for authentication
          schema:
            type: string
    created:
      description: Annotation, file, etc. has been created
      headers:
        Location:
          description: Location of the annotation, file etc.
          schema:
            type: string
            format: uri
    
    invalidBody:
      description: Request body is invalid or not wellformed
    
    # annotations:
    #   description: A list of annotations matching the query
    #   content:
    #     application/json:
    #       schema:
    #         $ref: "#/components/schemas/listAnnotations"
    #     application/xml:
    #       schema:
    #         $ref: "#/components/schemas/listAnnotations"
    fragments:
      description: A non-empty result set containing fragments within a file. If no matching fragments exist, the endpoint returns 204 without a response body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/listFragments"
        application/xml:
          schema:
            $ref: "#/components/schemas/listFragments"
    files:
      description: A non-empty result set containing files. If no matching files exist, the endpoint returns 204 without a response body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/listFiles"
        application/xml:
          schema:
            $ref: "#/components/schemas/listFiles"
    
    projects:
      description: A non-empty result set containing projects. If no matching projects exist, the endpoint returns 204 without a response body.
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/listProjects'
        application/json:
          schema:
            $ref: '#/components/schemas/listProjects'
    views:
      description: A non-empty result set containing views for a project or resource. If no matching views exist, the endpoint returns 204 without a response body.
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/listViews"
        application/json:
          schema:
            $ref: "#/components/schemas/listViews"

  #   entities:
  #     description: A list of entities matching the query
  #     content:
