    # Result:
    #   description: A result set, containing a list of 0+ project(s), file(s) etc.
    #   type: object
    #   xml:
    #     name: list
    #     namespace: https://github.com/dariok/wdbplus/api/schema/v1
    #   oneOf:
    #     - $ref: '#/components/schemas/listProjects'
    #     - $ref: '#/components/schemas/listViews'
    ResultBase:
      type: object
      xml:
        name: result
        namespace: https://github.com/dariok/wdbplus/api/schema/v1
      properties:
        total:
          $ref: '#/components/schemas/attTotal'
        start:
          $ref: '#/components/schemas/attStart'
        length:
          $ref: '#/components/schemas/attLength'
        query:
          $ref: '#/components/schemas/attQuery'
        self:
          $ref: '#/components/schemas/attSelf'
        from:
          $ref: '#/components/schemas/attFrom'
      required:
        - total
        - self
    
    listFragments:
      description: A non-empty result set containing fragments within a file. If no matching fragments exist, the endpoint returns 204 without a response body.
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            fragments:
              type: array
              minItems: 1
              xml:
                name: fragment
                wrapped: false
              items:
                $ref: "#/components/schemas/Fragment"
          required: [fragments]
    Fragment:
      description: describes a fragment within a file
      type: object
      xml:
        name: fragment
      properties:
        id:
          $ref: "#/components/schemas/attId"
    
    listFiles:
      description: A non-empty result set containing files. If no matching files exist, the endpoint returns 204 without a response body.
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            files:
              type: array
              minItems: 1
              xml:
                name: file
                wrapped: false
              items:
                $ref: "#/components/schemas/File"
          required: [files]
    File:
      description: one file
      type: object
      xml:
        name: file
      properties:
        id:
          $ref: "#/components/schemas/attId"
        details:
          $ref: "#/components/schemas/attDetails"
        label:
          $ref: "#/components/schemas/attLabel"
      required:
        - id
        - label
    
    listProjects:
      description: A non-empty result set containing projects. If no matching projects exist, the endpoint returns 204 without a response body.
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            projects:
              type: array
              minItems: 1
              xml:
                name: project
                wrapped: false
              items:
                $ref: '#/components/schemas/Project'
          required: [projects]
    Project:
      description: one project
      type: object
      xml:
        name: project
      properties:
        id:
          $ref: '#/components/schemas/attId'
        label:
          $ref: '#/components/schemas/attLabel'
      required:
        - id
        - label
    
    listViews:
      description: A non-empty result set containing views for a project or resource. If no matching views exist, the endpoint returns 204 without a response body.
      allOf:
        - $ref: '#/components/schemas/ResultBase'
        - type: object
          properties:
            views:
              type: array
              minItems: 1
              xml:
                name: view
                wrapped: false
              items:
                $ref: '#/components/schemas/View'
          required: [views]
    View:
      description: one view
      type: object
      xml:
        name: "view"
      properties:
        id:
          $ref: "#/components/schemas/attId"
        label:
          $ref: "#/components/schemas/attLabel"
      required:
        - id
        - label
    
    projectMetadata:
      description: project meta data
      type: object
      xml:
        namespace: "https://github.com/dariok/wdbmeta"
        name: project
      properties:
        title:
          type: string
          description: The Title of the project
        id:
          type: string
          description: The ID of the project if it is to be created with a specific ID
        collection:
          type: string
          description: The path where the project is to be created
      required:
        - title
        - collection

