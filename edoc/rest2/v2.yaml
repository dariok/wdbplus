      type: object
      xml:
        name: project
      properties:
        id:
          $ref: '#/components/schemas/id'
        label:
          $ref: '#/components/schemas/label'
      required:
        - id
        - label
    
    projectMetadata:
      description: project meta data
      type: object
      xml:
        namespace: "https://github.com/dariok/wdbmeta"
        name: project
      properties:
        title:
          type: string
          description: The Title of the project
        id:
          type: string
          description: The ID of the project if it is to be created with a specific ID
        path:
          type: string
          description: The path where the project is to be created; defaults to the value of `id`.
      required:
        - title

