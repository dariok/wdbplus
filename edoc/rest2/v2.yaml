openapi: 3.0.0
info:
  description: "wdb+ API v2 (wdb+ > v4.0) – see https://github.com/dariok/wdbplus for details"
  version: "2.0"
  title: "wdb+ API"
  # termsOfService: "see instance"
  contact:
    url: https://github.com/dariok/wdbplus
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080/exist/apps/edoc
tags:
  - name: auth
    description: Operations concerning authentication
  # - name: annotations
  #   description: Concerning Hobbits
  - name: projects
    description: Operations on wdb+ projects
  # - name: entities
  #   description: Operations on entities
  # - name: resources
  #   description: Operations on resources (usually texts)
  # - name: search
  #   description: Full text search
  # - name: oai
  #   description: OAI PMH endpoints
  # - name: dts
  #   description: Endpoints for Distributed Text Services
security:
  - cookieAuth: []
paths:
  /api/v2/login:
    post:
      summary: "User Login"
      description: "Start an authenticated session for the given user"
      tags: [ "auth" ]
      operationId: "auth:login"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/login"
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/login"
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                  groups:
                    type: array
                    items:
                      type: string
                  dba:
                    type: boolean
                  domain:
                    type: string
        '401':
          description: "Wrong user or password"
      security:
        - cookieAuth: []
  /api/v2/logout:
    get:
      summary: User Logout
      description: End session of the current user
      operationId: 'auth:logout'
      tags:
        - auth
      parameters:
        - name: logout
          in: query
          description: Set to some value to log out the current user
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  
