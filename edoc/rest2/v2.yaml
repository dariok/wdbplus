    project:
      description: The necessary data for the project to be created or updated
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/projectMetadata"
        application/xml:
          schema:
            $ref: "#/components/schemas/projectMetadata"
  #   entity:
  #     description: A (TEI) description of one entity
  #     required: true
  #     content:
  #       application/xml:
  #         schema:
  #           xml:
  #             name: entity
