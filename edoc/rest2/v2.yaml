  /api/v2/projects:
    get:
      tags:
        - projects
      summary: List all projects
      operationId: r2p:listProjects
      responses:
        "200":
          description: A non-empty result set of projects. This endpoint is expected to be non-empty because the global data collection must exist.
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/listProjects'
            application/json:
              schema:
                $ref: '#/components/schemas/listProjects'

  /api/v2/projects/{ed}:
    parameters:
      - $ref: "#/components/parameters/ed"
    # TODO: should this endpoint also return metadata?
    get:
      tags:
        - projects
      summary: Get project contents (registered resources and subprojects) by ID
      operationId: r2p:getProject
      responses:
        "200":
          $ref: "#/components/responses/projectContents"
        "204":
          description: No matching entries were found; no response body is returned.
        "404":
          description: No project found by this ID
    delete:
      tags:
        - projects
      summary: Delete project
      operationId: r2p:deleteProject
      responses:
        "204":
          description: The project has been deleted
        "404":
          description: This project was not found

  /api/v2/projects/{parent}/subprojects:
    parameters:
      - $ref: "#/components/parameters/parent"
    get:
      tags:
        - projects
      summary: Get a list of all subprojects of ${parent}
      operationId: r2p:listSubprojects
      responses:
        "200":
          $ref: "#/components/responses/projects"
        "204":
          description: No matching entries were found; no response body is returned.
        "404":
          description: Project $parent not found
    post:
      tags:
        - projects
      summary: Create a project in ${parent} without specifying an ID
      description: Create a project as child of ${parent} with the meta data provided in the body while auto-generating the ID. E.g., creating a new main project requires "data" as parent.
      operationId: r2p:createProjectWithoutId
      requestBody:
        $ref: "#/components/requestBodies/project"
      responses:
        "201":
          $ref: "#/components/responses/created"
        "400":
          $ref: "#/components/responses/invalidBody"
        "401":
          $ref: "#/components/responses/authenticate"
        "404":
          description: Project $parent not found
        "415":
          description: Unsupported Media Type. Check the Allow and Allow-Encoding headers.
        "422":
          description: Unprocessable Entity. The request was well-formed but was unable to be followed due to semantic errors in the body.
      security:
        - cookieAuth: []
  /api/v2/projects/{parent}/subprojects/{ed}:
    parameters:
      - $ref: "#/components/parameters/parent"
      - $ref: "#/components/parameters/ed"
    put:
      tags:
        - projects
      summary: Create project with given ID
      description: This creates a new or updates an existing project with the ID given as ed and the necessary meta data in the request body
      operationId: r2p:createProjectWithId
      requestBody:
        $ref: "#/components/requestBodies/project"
      responses:
        "201":
          $ref: "#/components/responses/created"
        "400":
          $ref: "#/components/responses/invalidBody"
        "401":
          $ref: "#/components/responses/authenticate"
        "404":
          description: Project $parent not found
        "409":
          description: A project exists with this ID in a different location or the location requested contains a project with a different ID
        "415":
          description: Unsupported Media Type. Check the Allow and Allow-Encoding headers.
        "422":
          description: Unprocessable Entity. The request was well-formed but was unable to be followed due to semantic errors in the body.
  
  /api/v2/projects/{ed}/views:
    parameters:
      - $ref: "#/components/parameters/ed"
    get:
      tags:
        - projects
      summary: Get a list of the views available for this project
      operationId: r2p:listProjectViews
      responses:
        "200":
          description: A non-empty result set of views. This endpoint is expected to be non-empty because the available views are defined statically.
          content:
            application/xml:
              schema:
                $ref: "#/components/schemas/listViews"
            application/json:
              schema:
                $ref: "#/components/schemas/listViews"
        "404":
          description: Project $ed not found
  /api/v2/projects/{ed}/views/{view}:
    parameters:
      - $ref: "#/components/parameters/ed"
      - $ref: "#/components/parameters/view"
    get:
      tags:
        - projects
      summary: Get a specific view of the project
      operationId: r2p:viewProject
      responses:
        "200":
          description: Representation of the project with the requested view in the negotiated media type.
          content:
            "application/xml":
              schema:
                type: object
                additionalProperties: true
            "application/json":
              schema:
                type: object
                additionalProperties: true
            "text/html":
              schema:
                type: string
        "404":
          description: Project $ed not found
        "406":
          description: The media type requested in an 'Accept' header cannot be created for this view

  /api/v2/projects/{ed}/resources:
    parameters:
      - $ref: "#/components/parameters/ed"
    options:
      tags:
        - projects
      summary: Preflight request before uploading
      operationId: r2p:optionsResource
      responses:
        "204":
          description: No matching entries were found; no response body is returned.
        "404":
          description: Project $ed not found
    get:
      tags:
        - projects
      summary: List resources in a project
      operationId: r2p:listProjectResources
      responses:
        "200":
          $ref: "#/components/responses/files"
        "204":
          description: No matching entries were found; no response body is returned.
        "404":
          description: Project $ed not found
    post:
      tags:
        - projects
      summary: Create a resource in a project (create an ID if necessary)
      operationId: r2p:createProjectResourceWithoutId
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - path
                - file
              properties:
                path:
                  type: string
                  description: Relative path inside the project (e.g. "texts/foo.xml")
                file:
                  type: object
                  format: binary
              encoding:
                file:
                  contentType: application/xml; charset=utf-8
      responses:
        "201":
          $ref: "#/components/responses/created"
        "400":
          $ref: "#/components/responses/invalidBody"
        "401":
          $ref: "#/components/responses/authenticate"
        "403":
          description: Forbidden
        "404":
          description: Project $ed not found
        "409":
          description: A file with this ID or file name is already present
        "415":
          description: Unsupported Media Type. Check the Allow and Allow-Encoding headers.
        "422":
          description: Invalid or incomplete information in the request body
      security:
        - cookieAuth: []
  /api/v2/projects/{ed}/resources/{id}:
    parameters:
      - $ref: "#/components/parameters/ed"
      - $ref: "#/components/parameters/id"
    put:
      tags:
        - projects
      summary: Create a resource in a project (with a given ID – this does not update resources)
      operationId: r2p:createProjectResourceWithId
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - path
                - file
              properties:
                path:
                  type: string
                  description: Relative path inside the project (e.g. "texts/foo.xml")
                file:
                  type: object
                  format: binary
              encoding:
                file:
                  contentType: application/xml; charset=utf-8
      responses:
        "204":
          description: File has been updated
        "400":
          $ref: "#/components/responses/invalidBody"
        "401":
          $ref: "#/components/responses/authenticate"
        "403":
          description: Forbidden
        "404":
          description: File $id not found in project $ed
        "409":
          description: A file with this ID is present in a different location or a file in this location exists with a different ID
        "415":
          description: Unsupported Media Type. Check the Allow and Allow-Encoding headers.
        "422":
          description: Invalid or incomplete information in the request body
      security:
        - cookieAuth: []

