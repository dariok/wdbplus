  /api/v2/resources/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - resources
      summary: Get resource by ID
      operationId: "r2r:getResource"
      responses:
        "200":
          description: Resource by ID
          content:
            "application/tei+xml":
              schema:
                $ref: "#/components/schemas/TEI"
        "404":
          description: No resource found by this ID
    put:
      tags:
        - resources
      summary: Replace a file
      operationId: "r2r:putResource"
      requestBody:
        description: Replace a file in-place
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Relative path inside the project (e.g. "texts/foo.xml")
                file:
                  type: object
                  format: binary
              encoding:
                file:
                  contentType: application/xml; charset=utf-8
      responses:
        "201":
          $ref: "#/components/responses/created"
        "204":
          description: File has been updated
        "400":
          $ref: "#/components/responses/invalidBody"
        "404":
          description: File $id not found
        "409":
          description: A file with this ID is present in a different location or a file in this location exists with a different ID
    patch:
      tags:
        - resources
      summary: Change a fragment from a file
      operationId: "r2r:patchResource"
      requestBody:
        description: The replacement XML fragment 
        required: true
        content:
          "application/xml":
            example: "<div xml:id='d1'>…</div>"
      responses:
        "204":
          description: File has been updated
        "400":
          $ref: "#/components/responses/invalidBody"
        "404":
          description: File $id not found
    head:
      tags:
        - resources
      summary: Preflight request
      operationId: "r2r:headResource"
      responses:
        "204":
          description: File was found
        "404":
          description: File $id not found
        "409":
          description: A file with this ID is present in a different location or a file in this location exists with a different ID
    options:
      tags:
        - resources
      summary: Preflight request
      operationId: "r2r:optionsResource"
      responses:
        "204":
          description: File was found
        "404":
          description: File $id not found
    delete:
      tags:
        - resources
      summary: Delete a file
      operationId: "r2r:deleteResource"
      responses:
        "204":
          description: File was deleted
        "404":
          description: File $id not found
  /api/v2/resources/{id}/views:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - resources
      summary: List views for a file
      operationId: "r2r:listResourceViews"
      responses:
        "200":
          description: A non-empty result set of views. An empty result would indicate an API error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listViews"
            application/xml:
              schema:
                $ref: "#/components/schemas/listViews"
  /api/v2/resources/{id}/views/{view}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/modified"
      - $ref: "#/components/parameters/view"
      - $ref: "#/components/parameters/accept"
      - name: view
        in: path
        description: The ID of the view to be invoked
        schema:
          type: string
        required: true
    get:
      tags:
        - resources
      summary: Get resource as represented by view
      operationId: "r2r:getResourceView"
      responses:
        200:
          description: The resource in the selected representation
        404:
          description: The resource or view was not found
        406:
          description: No representation could be created for the requested media type
  /api/v2/resources/byPid/{pid}:
    parameters:
      - name: "pid"
        in: path
        description: The externally defined persistend ID of a file
        schema:
          type: string
        required: true
    get:
      tags:
        - resources
      summary: Resolve an external PID to the canonical resource URL.
      operationId: "r2r:getResourceByPid"
      responses:
        "303":
          description: PID resolved; the canonical resource URL is given in the Location header.
          headers:
            Location:
              description: Canonical URL of the resolved resource.
              schema:
                type: string
                format: uri
        "404":
          description: No resource could be resolved for this PID.

  /api/v2/search/ft/project/{ed}:
    parameters:
      - $ref: "#/components/parameters/ed"
      - $ref: "#/components/parameters/q"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/max"
    get:
      tags:
        - search
      summary: List files in project containing text
      operationId: "r2s:searchProjects"
      responses:
        200:
          $ref: "#/components/responses/files"
        204:
          description: No matching entries were found; no response body is returned.
        400:
          description: An error was found in the query
        404:
          description: project not found
        406:
          description: Unsupported media type requested
  /api/v2/search/ft/resource/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
      - $ref: "#/components/parameters/accept"
      - $ref: "#/components/parameters/q"
      - $ref: "#/components/parameters/start"
      - $ref: "#/components/parameters/max"
    get:
      tags:
        - search
      summary: List fragments in file containing text
      operationId: "r2s:searchFile"
      responses:
        200:
          $ref: "#/components/responses/fragments"
        204:
          description: No matching entries were found; no response body is returned.
        400:
          description: An error was found in the query
        404:
          description: File not found
        406:
          description: Unsupported media type request

