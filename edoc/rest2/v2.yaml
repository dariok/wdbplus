    attId:
      description: ID of this entry
      type: string
      format: uri
      xml:
        attribute: true
    attDetails:
      description: A link to a more detailed description, e.g. dearch in a file
      type: string
      format: uri
      xml:
        attribute: true
    attFrom:
      description: URI of the content (project, resource) from which this result is taken or for which a list is valid
      type: string
      format: uri
      xml:
        attribute: true
    attLabel:
      description: Title to be displayed for this entry
      type: string
      xml:
        attribute: true
    attLength:
      description: The (maximum) length of a page of the result set
      type: integer
      default: 1
      xml:
        attribute: true
    attLevel:
      description: For which type of content is this result produced
      type: string
      enum:
        - "global"
        - "project"
        - "resource"
      xml:
        attribute: true
    attQuery:
      description: the value of the query parameter passed to the endpoint
      type: string
      xml:
        attribute: true
    attSelf:
      description: A backlink to the query that created a result set
      type: string
      format: URI
      xml:
        attribute: true
    attStart:
      description: from which position in a paginated list the result set starts (1-based)
      type: integer
      default: 1
      xml:
        attribute: true
    attTotal:
      description: total number of entries in the result set
      type: integer
      xml:
        attribute: true
