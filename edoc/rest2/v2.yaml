  #             - $ref: "#/components/schemas/entity-event"
    projectContents:
      description: Lists the registered contents of a project
      content:
        application/xml:
          schema:
            $ref: '#/components/schemas/contents'
        application/json:
          schema:
            $ref: '#/components/schemas/contents'

  requestBodies:
