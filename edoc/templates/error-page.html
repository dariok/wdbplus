<!DOCTYPE html>
<html>
   <head>

      <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

      <!-- these CSS links are hard coded to avoid loops; a 404 here is preferable to untracable errors -->
      <link rel="stylesheet" type="text/css" href="$shared/css/wdb.css" />
      <link rel="stylesheet" type="text/css" href="$global/css/wdb.css" />
      <link rel="stylesheet" type="text/css" href="$shared/css/function.css" />
      <link rel="stylesheet" type="text/css" href="$global/css/function.css" />
      <link rel="stylesheet" type="text/css" href="$shared/css/error.css" />
      <link rel="stylesheet" type="text/css" href="$global/css/error.css" />
      <script src="$shared/js/function.js"/>
   </head>
   <body xmlns="http://www.w3.org/1999/xhtml">
      <header>
         <div class="headerCentre">
            <h1 data-template="wdbfp:evalForElement" data-template-expression="$config:configFile//config:name/string()" />
         </div>
      </header>
      <main>
         <div data-template="wdbErr:getError" class="errorContainer" />
      </main>
      <footer data-template="wdbfp:getFooter" />

</html>
